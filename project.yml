name: LocalFLACPlayer
options:
  bundleIdPrefix: com.shitiankexin
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CLANG_ENABLE_MODULES: YES
targets:
  LocalFLACPlayer:
    type: application
    platform: iOS
    sources:
      - path: FLACPlayer
        excludes:
          - Support/Info.plist
          - Support/BridgingHeader.h
          - Audio/FLACBridge.h
          - Support/PrivacyInfo.xcprivacy
      - path: FLACPlayer/Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources  
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shitiankexin.localflacplayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: FLACPlayer/Support/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: FLACPlayer/Support/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/Headers"
          - "$(PROJECT_DIR)/FLACPlayer/Audio"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "心清音乐"
    dependencies:
      - framework: Vendor/libFLAC.xcframework
        embed: false
  LocalFLACPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LocalFLACPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shitiankexin.localflacplayer.tests
