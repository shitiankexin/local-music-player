name: hongdakuaibo
options:
  bundleIdPrefix: com.shitiankexin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  hongdakuaibo:
    type: application
    platform: iOS
    sources:
      - path: hongdakuaibo
        excludes:
          - Info.plist
          - Support/BridgingHeader.h
          - Audio/FLACBridge.h
          - Support/PrivacyInfo.xcprivacy
      - path: hongdakuaibo/Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shitiankexin.hongdakuaibo
        PRODUCT_NAME: hongdakuaibo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: hongdakuaibo/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: hongdakuaibo/Support/BridgingHeader.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/Headers"
          - "$(PROJECT_DIR)/hongdakuaibo/Audio"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "洪达快播"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - framework: Vendor/libFLAC.xcframework
        embed: false
  hongdakuaiboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: hongdakuaibo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shitiankexin.hongdakuaibo.tests
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  hongdakuaibo:
    build:
      targets:
        hongdakuaibo: all
        hongdakuaiboTests: [test]
    test:
      targets:
        - hongdakuaiboTests
    run:
      config: Debug
    archive:
      config: Release
